[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-asr"
version = "0.1.0"
description = "Whisper and pyannote meeting transcription with AMI evaluation"
requires-python = ">=3.11,<3.14"
dependencies = ["jiwer==4.0.0", "defusedxml==0.7.1", "numpy>=2.2,<3", "soundfile==0.13.1", "scipy>=1.15,<2", "python-dotenv==1.1.1"]

[project.optional-dependencies]
inference = ["openai-whisper==20250625", "pyannote.audio==4.0.1", "torch==2.8.0", "torchaudio==2.8.0", "pyannote.metrics==4.0.0"]
dashboard = ["streamlit==1.50.0", "plotly==6.3.1"]
dev = ["pytest==8.4.2", "ruff==0.14.1"]

[project.scripts]
meeting-asr = "meeting_asr.cli:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
